name: Translations

on:
  pull_request:
    # Release PRs only (develop -> production), like tests.yml.
    branches: [production]
    paths:
      - 'src/locales/**'
      - 'src/i18n/**'
      - 'src/**/*.js'
      - 'src/**/*.jsx'
      - 'scripts/i18n/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The checker only uses Node built-ins, so no npm install is needed.
      - run: node scripts/i18n/check.mjs
