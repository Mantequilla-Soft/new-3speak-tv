name: Deploy to 3speak.tv

# Every push to `production` (a merged develop -> production PR) goes live on
# 3speak.tv. The runner only opens an SSH connection: the box fetches, builds and
# swaps the site itself (/usr/local/sbin/3speak-prod-deploy), so no code from the
# runner ever reaches the server.
#
# The `deploy-3speak` key in the `production-server` environment can run nothing
# but "deploy <commit>" / "check <commit>", and the environment only hands it to
# runs on the `production` branch. The box waits for running video uploads to
# finish before it swaps, smoke-tests the live site afterwards and swaps back on
# failure. A deploy of what is already live is a no-op, so re-running is safe.
#
# Manual run (Actions tab, on production): "check" builds without going live.

on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      mode:
        description: 'deploy = go live, check = build only'
        type: choice
        options: [deploy, check]
        default: deploy

permissions:
  contents: read

# One deploy at a time, and never cancel one halfway: the next push queues behind it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production-server
    # The box may wait up to an hour for uploads to finish before swapping.
    timeout-minutes: 100
    steps:
      - name: Deploy on the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
          PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          MODE: ${{ inputs.mode || 'deploy' }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p "$PORT" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            "$DEPLOY_USER@$HOST" "$MODE $GITHUB_SHA"
          rm -f ~/.ssh/deploy_key

  # After a successful deploy that bumped APP_VERSION, tag the commit v<version>
  # and publish a GitHub Release whose notes are the changelog entries since the
  # last release. A deploy without a bump, a "check" run or a failed deploy
  # creates nothing, and an existing tag is never touched, so re-runs are safe.
  # Only this job can write to the repo; it never talks to the server.
  release:
    needs: deploy
    if: github.event_name == 'push' || inputs.mode == 'deploy'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version_at() { git show "$1:src/version.js" | sed -nE "s/^export const APP_VERSION = '([^']+)'.*/\1/p"; }
          version=$(version_at "$GITHUB_SHA")
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag is already released, nothing to do."
            exit 0
          fi
          # The previous release on production's own history; before the first
          # one, whatever production ran before this merge.
          prev_tag=$(git describe --tags --abbrev=0 --first-parent --match 'v*' "$GITHUB_SHA" 2>/dev/null || true)
          if [ -n "$prev_tag" ]; then prev=${prev_tag#v}; else prev=$(version_at "$GITHUB_SHA^1"); fi
          if [ "$prev" = "$version" ]; then
            echo "APP_VERSION is still $version, no release."
            exit 0
          fi
          node scripts/release-notes.mjs "$prev" "$version" > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md" --latest
