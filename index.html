<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="3speak.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Warm up connections to the video CDN + player API so card previews
         (and playback) fetch their first manifest/segment without paying DNS/TLS setup. -->
    <link rel="preconnect" href="https://hotipfs-3speak-1.b-cdn.net" crossorigin />
    <link rel="preconnect" href="https://play.3speak.tv" crossorigin />
    <link rel="dns-prefetch" href="https://hotipfs-3speak-1.b-cdn.net" />
    <link rel="dns-prefetch" href="https://play.3speak.tv" />

    <!-- The two busiest origins on a cold home feed, and both were missing: the
         checker serves the feed itself (the FIRST request that matters) and
         images.hive.blog serves every avatar on the page. Warming these saves a
         DNS+TLS round trip each before the feed can even start rendering. -->
    <link rel="preconnect" href="https://checker.3speak.tv" crossorigin />
    <link rel="preconnect" href="https://images.hive.blog" crossorigin />
    <link rel="dns-prefetch" href="https://checker.3speak.tv" />
    <link rel="dns-prefetch" href="https://images.hive.blog" />

    <!-- Primary Meta Tags -->
    <title>3S | Real People - Real Stories</title>
    <meta name="title" content="3S | Real People - Real Stories" />
    <meta name="description" content="3Speak is a decentralized video sharing platform built on blockchain technology. Watch, upload, and share videos while earning cryptocurrency rewards." />
    <meta name="keywords" content="3speak, decentralized video, blockchain video, crypto video platform, web3 video, hive blockchain, video sharing, cryptocurrency" />
    <meta name="author" content="3Speak" />
    <meta name="robots" content="index, follow" />
    <!--
      No static canonical here on purpose. This shell is shared by every SPA
      route, so a hardcoded canonical would make every page declare the
      homepage as its canonical. Search crawlers receive a correct per-page
      canonical from the Edge Middleware (middleware.js). For the SPA itself,
      per-route canonical/meta should be set client-side via react-helmet-async
      (already a dependency) — tracked as a follow-up.
    -->
    <link rel="canonical" href="https://3speak.tv/" data-route="home" />
    <script>
      // Drop the homepage canonical on any non-home route so we don't tell
      // crawlers that render JS (or non-listed bots) that every video page
      // canonicalizes to the homepage. Removing it lets Google self-select
      // until react-helmet sets the real per-route canonical.
      if (location.pathname !== '/' || location.search) {
        var c = document.querySelector('link[rel="canonical"][data-route="home"]');
        if (c) c.parentNode.removeChild(c);
      }
    </script>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://3speak.tv/" />
    <meta property="og:title" content="3S | Real People - Real Stories" />
    <meta property="og:description" content="3Speak is a decentralized video sharing platform built on blockchain technology. Watch, upload, and share videos while earning cryptocurrency rewards." />
    <!-- A real 1200x630 banner: the square 3speak.jpeg (still the favicon) was stretched to these dimensions in link previews. -->
    <meta property="og:image" content="https://3speak.tv/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="3Speak" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://3speak.tv/" />
    <meta property="twitter:title" content="3S | Real People - Real Stories" />
    <meta property="twitter:description" content="3Speak is a decentralized video sharing platform built on blockchain technology. Watch, upload, and share videos while earning cryptocurrency rewards." />
    <meta property="twitter:image" content="https://3speak.tv/og-image.jpg" />
    <meta name="twitter:site" content="@3speaktv" />
    <meta name="twitter:creator" content="@3speaktv" />

    <!-- Additional Meta Tags -->
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="description" content="3Speak - Decentralized Video Platform" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="3Speak" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <!--
      Three third-party loaders used to sit here. All removed 2026-07-14:

      • fonts.googleapis.com (Roboto) — hotlinking Google Fonts discloses every
        visitor's IP to Google on page load. That is the textbook German Abmahnung
        trigger (LG München I, 3 O 17493/20). Roboto is now bundled and served from
        our own origin via @fontsource/roboto, imported in src/main.jsx.
      • cdn.quilljs.com — same IP-disclosure problem, and it served Quill 1.3.6's
        CSS while we bundle Quill 2.0.3. Now imported from the local dep in
        src/components/studio/TextEditor.jsx.
      • cdn.jwplayer.com — a third-party video SDK that writes browser storage and
        phones home to JW's analytics. Loaded on EVERY page load and never used:
        `jwplayer` appears nowhere in src/. Pure liability; deleted.

      Keep it that way: anything loaded from another origin leaks visitor IPs and can
      drag the site back into cookie-consent territory.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
